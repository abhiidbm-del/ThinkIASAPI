$kind: http-request
url: "{{baseUrl}}/api/app/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) { const data=pm.response.json().data; pm.collectionVariables.set('token', data.token); }
    language: text/javascript
order: 9000
