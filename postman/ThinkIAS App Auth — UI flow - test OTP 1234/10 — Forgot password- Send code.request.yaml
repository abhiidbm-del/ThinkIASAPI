$kind: http-request
name: "10 — Forgot password: Send code"
url: "{{baseUrl}}/api/app/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) { const data=pm.response.json().data; pm.collectionVariables.set('resetChallengeId', data.challengeId); }
    language: text/javascript
order: 10000
