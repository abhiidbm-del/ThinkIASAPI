$kind: http-request
url: "{{baseUrl}}/api/app/auth/verify-reset-otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "challengeId": "{{resetChallengeId}}",
      "otp": "{{otp}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) { const data=pm.response.json().data; pm.collectionVariables.set('resetToken', data.resetToken); }
    language: text/javascript
order: 11000
