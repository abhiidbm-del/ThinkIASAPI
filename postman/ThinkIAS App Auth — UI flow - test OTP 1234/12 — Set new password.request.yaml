$kind: http-request
url: "{{baseUrl}}/api/app/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "resetToken": "{{resetToken}}",
      "password": "{{newPassword}}",
      "confirmPassword": "{{newPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 12000
