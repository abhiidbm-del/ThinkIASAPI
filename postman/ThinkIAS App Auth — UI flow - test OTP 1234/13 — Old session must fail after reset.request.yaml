$kind: http-request
url: "{{baseUrl}}/api/app/auth/me"
method: GET
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 401', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 13000
