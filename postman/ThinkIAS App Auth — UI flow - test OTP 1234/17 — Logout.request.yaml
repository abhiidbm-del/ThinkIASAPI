$kind: http-request
url: "{{baseUrl}}/api/app/auth/logout"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 17000
