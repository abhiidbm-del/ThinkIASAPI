$kind: http-request
name: "04 — Verify email: OTP 1234"
url: "{{baseUrl}}/api/app/auth/verify-email"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "challengeId": "{{registrationChallengeId}}",
      "otp": "{{otp}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', function () { pm.response.to.have.status(200); });
      if (pm.response.code === 200) { const data=pm.response.json().data; pm.collectionVariables.set('verificationToken', data.verificationToken); }
    language: text/javascript
order: 4000
