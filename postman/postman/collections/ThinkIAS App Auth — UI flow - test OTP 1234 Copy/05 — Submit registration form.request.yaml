$kind: http-request
url: "{{baseUrl}}/api/app/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "verificationToken": "{{verificationToken}}",
      "fullName": "App Test Student",
      "phone": "9876543210",
      "password": "{{password}}",
      "confirmPassword": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 201', function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) { const data=pm.response.json().data; pm.collectionVariables.set('token', data.token); }
    language: text/javascript
order: 5000
