$kind: http-request
url: "{{baseUrl}}/api/app/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('HTTP 401', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 14000
